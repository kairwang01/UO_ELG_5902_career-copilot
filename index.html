      /* Basic Prose styles for AI-generated content */
      .prose {
        --tw-prose-body: #374151;
        --tw-prose-headings: #1f2937;
        --tw-prose-lead: #4b5563;
        --tw-prose-links: #1d4ed8;
        --tw-prose-bold: #111827;
        --tw-prose-counters: #6b7280;
        --tw-prose-bullets: #d1d5db;
        --tw-prose-hr: #e5e7eb;
        --tw-prose-quotes: #111827;

        --tw-prose-captions: #6b7280;
        --tw-prose-code: #111827;
        --tw-prose-pre-code: #e5e7eb;
        --tw-prose-pre-bg: #1f2937;
        --tw-prose-invert-body: #d1d5db;
        --tw-prose-invert-headings: #fff;
        --tw-prose-invert-bold: #fff;
      }
      .dark .dark\:prose-invert {
        --tw-prose-body: var(--tw-prose-invert-body);
        --tw-prose-headings: var(--tw-prose-invert-headings);
        --tw-prose-bold: var(--tw-prose-invert-bold);
      }
      .prose-sm { font-size: 0.875rem; line-height: 1.6; }
      .prose-sm p { margin-top: 0.8em; margin-bottom: 0.8em; }
      .prose-sm ul { margin-top: 0.8em; margin-bottom: 0.8em; padding-left: 1.5em; list-style-type: disc; }
      .prose-sm ul > li { margin-top: 0.2em; margin-bottom: 0.2em; }
      .prose-sm strong { font-weight: 600; color: var(--tw-prose-bold); }
      .dark .prose-sm strong { color: var(--tw-prose-invert-bold); }
      .prose-sm h3 { font-size: 1.1em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; color: var(--tw-prose-headings); }
      .dark .prose-sm h3 { color: var(--tw-prose-invert-headings); }
      .dark .prose-sm { color: var(--tw-prose-invert-body); }
    </style>
